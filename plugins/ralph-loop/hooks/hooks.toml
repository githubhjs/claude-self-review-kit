# ChipAgents hooks for ralph-loop (Claude Code uses hooks.json instead).
# While a loop started by scripts/setup-ralph-loop.sh is active, every
# agent turn ends with a rerun of the same task until the agent writes the
# completion promise to .claude/ralph-loop.promise or max iterations is hit.

# Upper bound on reruns per turn; keep it >= --max-iterations. A value set
# earlier in the hierarchy (e.g. the project's .chipagents/hooks.toml) wins.
post_turn_restarts = 20

[[post_turn]]
type = "bash"
command = 'bash "${CHIPAGENTS_PLUGIN_ROOT}/hooks/stop-hook-chipagents.sh"'
blocking = true
enable_restarts = true
timeout = 30
